# Fly.io configuration for the transfer.html relay.
# App name must be globally unique — change `app` to something you pick,
# or let `fly launch` prompt you for one.

app = "CHANGE-ME-transfer-relay"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Free-tier friendly: scale to zero when idle, wake on first connect.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
